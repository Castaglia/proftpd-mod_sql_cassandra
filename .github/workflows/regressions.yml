name: Regression Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.html'
      - '*.md'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Let's try opting into use of Nodejs v24; see:
      #  https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      # GitHub runners still causing problems with NodeJS v20; see:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      DEBIAN_FRONTEND: noninteractive
      TZ: America/Los_Angeles
      CASSANDRA_HOST: cassandra

    services:
      cassandra:
        # Docker Hub image
        image: bitnamilegacy/cassandra:4.0
        env:
          CASSANDRA_HOST: cassandra 

    strategy:
      matrix:
        container:
          - ubuntu:22.04

    container: ${{ matrix.container }}

    steps:
      - name: Checkout ProFTPD
        uses: actions/checkout@v6
        with:
          repository: proftpd/proftpd
          path: proftpd

      - name: Checkout module source code
        uses: actions/checkout@v6
        with:
          path: proftpd-mod_sql_cassandra

      - name: Checkout Cassandra CPP Driver
        uses: actions/checkout@v6
        with:
          repository: apache/cassandra-cpp-driver
          path: cassandra-cpp-driver

      - name: Install Ubuntu packages
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: UTC
        run: |
          apt-get update -qq
          # for builds
          apt-get install --no-install-recommends -y build-essential cmake gcc g++ git make tzdata

          # for Cassandra support; see
          #  https://docs.datastax.com/en/developer/cpp-driver/2.17/topics/installation/
          apt-get install --no-install-recommends -y curl libssl-dev libkrb5-dev libuv1-dev zlib1g-dev

          # for integration/regression tests
          apt-get install --no-install-recommends -y \
            libauthen-oath-perl \
            libcompress-raw-zlib-perl \
            libdata-dumper-simple-perl \
            libdatetime-perl \
            libfile-copy-recursive-perl \
            libfile-path-tiny-perl \
            libfile-spec-native-perl \
            libmime-base32-perl \
            libnet-address-ip-local-perl \
            libnet-inet6glue-perl \
            libnet-ssh2-perl \
            libnet-ssleay-perl \
            libnet-telnet-perl \
            libposix-2008-perl \
            libtest-unit-perl \
            libtime-hr-perl \
            libwww-perl
          PERL_MM_USE_DEFAULT=1 perl -MCPAN -e 'install Net::FTPSSL'

          # for cqlsh
          apt-get install -y curl software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get install -y python3.10 python3.10-venv
          curl -s https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          python3.10 get-pip.py
          pip3 --version
          pip3 install cqlsh
          cqlsh --version

          # for debugging
          gcc --version

      - name: Install Cassandra CPP Driver
        run: |
          cd cassandra-cpp-driver/
          mkdir build/
          cd build/
          cmake ..
          make
          make install
          cd ../../
          /sbin/ldconfig -v

      - name: Prepare module source code
        run: |
          cp proftpd-mod_sql_cassandra/mod_sql_cassandra.c proftpd/contrib/mod_sql_cassandra.c

      - name: Install with static modules
        # NOTE: Docker does not have good IPv6 support, hence we disable it.
        run: |
          cd proftpd
          ./configure --disable-ipv6 --with-modules=mod_sql:mod_sql_cassandra
          make
          make install
          /usr/local/sbin/proftpd -V

      - name: Run integration tests
        env:
          PROFTPD_TEST_BIN: /usr/local/sbin/proftpd
          PROFTPD_TEST_CI: github
          PROFTPD_TEST_DIR: ${{ github.workspace }}/proftpd/tests
        run: |
          cd proftpd-mod_sql_cassandra
          cqlsh -u cassandra -p cassandra -f t/etc/modules/mod_sql_cassandra/user.cql cassandra 9042
          cqlsh -u proftpd -p developer -f t/etc/modules/mod_sql_cassandra/keyspace.cql cassandra 9042
          perl tests.pl
