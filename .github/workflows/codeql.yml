name: CodeQL

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: "12 12 * * 4"

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      # Let's try opting into use of Nodejs v24; see:
      #  https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      # GitHub runners still causing problems with NodeJS v20; see:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: true
      matrix:
        language:
          - cpp

    steps:
      - name: Checkout ProFTPD
        uses: actions/checkout@v6
        with:
          repository: proftpd/proftpd

      - name: Checkout mod_sql_cassandra
        uses: actions/checkout@v6
        with:
          path: proftpd-mod_sql_cassandra

      - name: Checkout Cassandra CPP Driver
        uses: actions/checkout@v6
        with:
          repository: apache/cassandra-cpp-driver
          path: cassandra-cpp-driver

      - name: Prepare module
        run: |
          cp proftpd-mod_sql_cassandra/mod_sql_cassandra.c contrib/mod_sql_cassandra.c

      - name: Install Packages
        env:
          CPP_DRIVER_VERSION: 2.17.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc g++ make
          sudo apt-get install -y libssl-dev libkrb5-dev libuv1-dev zlib1g-dev

      - name: Install Cassandra CPP Driver
        run: |
          cd cassandra-cpp-driver/
          mkdir build/
          cd build/
          cmake ..
          make
          sudo make install
          cd ../../

      - name: Configure
        run: |
          ./configure --with-modules=mod_sql:mod_sql_cassandra

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: proftpd-mod_sql_cassandra/.codeql.yml
          queries: +security-and-quality
          source-root: proftpd-mod_sql_cassandra

      - name: Build
        run: |
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          checkout_path: proftpd-mod_sql_cassandra
          output: sarif-results
          upload: false

      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          checkout_path: proftpd-mod_sql_cassandra
          sarif_file: "sarif-results/${{ matrix.language }}.sarif"
